[pytest]
# Marker registry — keeps `pytest --strict-markers` happy and makes the
# tier gating documented in CLAUDE.md self-describing in the test runner.
markers =
    sim: Tier 3 — sim-integration tests; require Gazebo + HAL bridges. Slow (~30s+) and brittle. Opt in with: pytest -m sim test/sim/
    hil: Tier 4 — hardware-in-the-loop tests; require the real STM driver on the bench. Opt in with: pytest -m hil test/hil/

# Default invocation excludes sim + hil so:
#   * `pytest test/unit/`  — runs Tier 1 only.
#   * `pytest test/node/`  — runs Tier 2 only.
#   * `pytest test/`       — runs Tier 1 + Tier 2 (sim/hil filtered out).
#   * `colcon test`        — same filter applies.
# Override with `-m sim` (or `-m hil`) to opt in.
addopts = -m "not sim and not hil"
