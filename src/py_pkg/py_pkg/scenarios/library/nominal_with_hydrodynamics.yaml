# Nominal scenario with the `rig.hydrodynamics:` block listed explicitly.
#
# Same plant, controllers, faults, and bridges as `nominal.yaml`. The
# difference is the `rig.hydrodynamics:` block: every coefficient is
# present and pinned to its current canonical-SDF value. That means
# this YAML exercises the Jinja render path (the launch sees a non-None
# `rig.hydrodynamics` and renders `model.sdf.jinja` to a temp file)
# while producing an SDF byte-identical to the canonical `model.sdf` —
# `nominal.yaml` skips the render entirely; this one renders, but the
# render is a no-op.
#
# Uses:
#  - Smoke-test the rendering pipeline end-to-end without changing plant
#    behaviour.
#  - Reference for what's perturbable: copy this file, tweak the
#    coefficients you care about, point a sampled run at it.
#
# Sampling strategy (LHS / Sobol / Halton / plain Monte Carlo /
# hand-picked corners) is the orchestrator's call — the spec shape is
# the same regardless.

seed: 0

control:
  controllers:
    depth:
      frequency_hz: 10
      # Bang-bang: one speed, one direction, until the tank rails or the
      # mission's next leg flips the sign of the depth error.
      pump_rpm: 3000
      deadband_pa: 2000.0
      tank_stop_band: 0.05
    acu_pitch:
      output_limits: [-0.11, -0.01]
    acu_roll:
      frequency_hz: 10
      kp: 0.5
      ki: 0.005
      kd: 0.05
      command_tolerance: 0.5
      integral_limits: [-30.0, 30.0]
      output_limits: [-30.0, 30.0]
      derivative_filter: 0.2

rig:
  sim:
    model_name: glider_nautilus
    world_name: oceans_waves
  plant:
    volume_per_rev_m3: 0.32e-6
    # Lake-calibrated operating range + tank endpoints — see nominal.yaml.
    bladder_min_m3: 0.001
    bladder_max_m3: 0.00245
    bladder_nominal_m3: 0.0025
    tank_pressure_empty_pa: 97800.0
    tank_pressure_full_pa: 190000.0
    bcu_motor_min_rpm: 0
    bcu_motor_max_rpm: 3000
  faults:
    # All persistent faults disabled (healthy pump, clean sensors/link).
    bcu_pump:
      effectiveness: 1.0
    sensors:
      external_pressure:
        kind: none
      tank_pressure:
        kind: none
    comms:
      drop_prob: 0.0
  bridges:
    bcu:
      publish_rate_hz: 10
    external_sensor:
      publish_rate_hz: 10
  # Sensor noise injected by the HAL sim bridges (Gaussian sigma +
  # digitizer quantization). Values are the fits from the 2026-06-24
  # lake test — provenance: UG-anomaly_detection/lake_test_jun24/
  # investigation/noise_characterization.json. `enabled: false`
  # restores noise-free bridges without touching the per-channel values.
  noise:
    enabled: true
    imu:
      accel_sigma_mps2: [0.01215, 0.02372, 0.009544]
      gyro_sigma_rads: [0.006541, 0.001033, 0.0008779]
    external_pressure:
      # Real channel is quantization-dominated: sub-LSB Gaussian, 100 Pa comb.
      sigma_pa: 0.0
      quantization_pa: 100.0
    tank_pressure:
      sigma_pa: 353.0
      quantization_pa: 600.0

  # Hydrodynamic plant — every field at its canonical-SDF value. Render
  # path fires (since the block is present), but the rendered SDF
  # equals `model.sdf` byte-for-byte. The Tier 3 parity test in
  # nautilus_hal locks that equivalence in.
  hydrodynamics:
    # Fluid density seen by the model-side plugins (BuoyancyEngine,
    # Hydrodynamics, LiftDrag). Fresh water, lake-calibrated. Must agree
    # with the world buoyancy plugin's <default_density>.
    fluid_density: 1000.0

    # Body <fluid_added_mass> (model.sdf lines 39-46).
    added_mass_xx: 5.30023995
    added_mass_yy: 98.529516
    added_mass_zz: 110.543023
    added_mass_pp: 1.46943124
    added_mass_qq: 20.2676439
    added_mass_rr: 16.1139805

    # Hydrodynamics plugin linear-drag diagonals. drag_zW carries the
    # lake-fit heave value (heave_calibration_fit.json).
    drag_xU: -108.0
    drag_yV: -8.0
    drag_zW: -52.2
    drag_kP: -13.0
    drag_mQ: -32.0
    drag_nR: -20.0

    # Hydrodynamics plugin quadratic-drag diagonals. drag_zWabsW is
    # fitted together with drag_zW from the lake dives.
    drag_xUabsU: 0.0
    drag_yVabsV: 0.0
    drag_zWabsW: -436.7
    drag_kPabsP: 0.0
    drag_mQabsQ: 0.0
    drag_nRabsR: 0.0

    # HeaveAugmentPlugin: ascent drag relief (fraction of heave drag
    # retained on ascent; fitted to the dive-2/4 ascent legs) and the
    # descent-entry momentum transient (target 5 s box-smoothed rate
    # peak; mean of the dive-2/4 entry peaks). retain_fraction: 1.0 /
    # peak_speed_mps: 0.0 are the exact no-op values.
    ascent_relief:
      retain_fraction: 0.66
    entry:
      peak_speed_mps: 0.205
      rise_time_s: 20.0
      decay_time_s: 25.0

    # Centerline trim-link masses (see the mass-budget note in
    # model.sdf) — bow + stern solved jointly so the fresh-water neutral
    # bladder volume matches the lake fit (V_n = 2.097e-3 m^3) AND the
    # vehicle floats level at the spawn bladder volume, like the real
    # pre-dive surface float.
    trim_mass_bow: 3.157
    trim_mass_stern: 0.2765
    trim_mass_bladder: 0.001

    # BuoyancyEngine <default_volume>: bladder fill at spawn, slightly
    # above the neutral point so the vehicle floats gently at rest.
    bladder_spawn_volume_m3: 0.0022

    # Per-fin lift/drag (model.sdf lines 289 / 353 / 462). Fins share
    # area (0.0725 m^2); the top rudder is smaller (0.0244 m^2). All
    # three plug into the same FinAeroSpec schema.
    left_fin:
      cla: 4.13
      cla_stall: -1.1
      cda: 0.2
      cda_stall: 0.03
      alpha_stall: 0.17
      a0: 0.0
      area: 0.0725
    right_fin:
      cla: 4.13
      cla_stall: -1.1
      cda: 0.2
      cda_stall: 0.03
      alpha_stall: 0.17
      a0: 0.0
      area: 0.0725
    top_rudder:
      cla: 4.13
      cla_stall: -1.1
      cda: 0.2
      cda_stall: 0.03
      alpha_stall: 0.17
      a0: 0.0
      area: 0.0244
