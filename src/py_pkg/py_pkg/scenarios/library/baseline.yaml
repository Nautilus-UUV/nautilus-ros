# Baseline scenario for the Nautilus control + sim stack.
#
# Values at nominal mirror robot_specs.py + today's pid configs +
# nautilus_params.yaml. Phase 7 adds a CI parity test that asserts
# rig.plant matches robot_specs field-by-field.
#
# `control:` configures the Nautilus controllers (py_pkg side).
# `rig:` configures the simulator plant + fault injection (HAL side).
# Both halves load through a single `load_scenario`; callers pick
# `.control` or `.rig`.

seed: 0

control:
  controllers:
    depth:
      frequency_hz: 10
      pid_pressure:
        kp: 5.119127756253602e-07
        ki: 1.210444124384171e-08
        kd: 1.7448840717788575e-05
        integral_limits:
        - -0.0025
        - 0.0025
        output_limits:
        - -0.01
        - 0.01
        derivative_filter: 0.3
      plant_model:
        bladder_nominal_m3: 0.0025
        initial_proportion_full: 1.0
        min_rpm: 500
        min_operating_rpm: 1000
        max_rpm: 3000
        pump_efficiency: 0.93
    acu_pitch:
      name: pitch
      output_limits: [-0.11, -0.01]
    acu_roll:
      frequency_hz: 10
      name: roll
      kp: 0.5
      ki: 0.005
      kd: 0.05
      command_tolerance: 0.5
      integral_limits: [-30.0, 30.0]
      output_limits: [-30.0, 30.0]
      derivative_filter: 0.2

rig:
  sim:
    model_name: glider_nautilus
    world_name: oceans_waves
  plant:
    volume_per_rev_m3: 0.32e-6
    bladder_min_m3: 0.0004969875585183712
    bladder_max_m3: 0.0017114339203579084
    bladder_nominal_m3: 0.0025
    bcu_motor_min_rpm: 0
    bcu_motor_max_rpm: 3000
  faults:
    bcu_rpm:
      # Monotonic pump degradation: one 20% effectiveness step every ~60 s
      # on average, latching at 0% (broken). No recovery.
      mttf_sec: 60.0
      num_levels: 5
  bridges:
    bcu:
      publish_rate_hz: 10
    external_sensor:
      publish_rate_hz: 10
