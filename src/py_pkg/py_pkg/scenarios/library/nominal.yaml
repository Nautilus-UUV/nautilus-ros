# Nominal scenario: perturbation-free reference for Monte Carlo sweeps.
#
# Identical to baseline.yaml except BCU fault injection is disabled
# (`mttf_sec: 0.0`). Use this as the deterministic baseline
# every MC run differs from.

seed: 0

control:
  controllers:
    depth:
      frequency_hz: 10
      pid_pressure:
        kp: 5.119127756253602e-07
        ki: 1.210444124384171e-08
        kd: 1.7448840717788575e-05
        integral_limits:
        - -0.0025
        - 0.0025
        output_limits:
        - -0.01
        - 0.01
        derivative_filter: 0.3
      plant_model:
        bladder_nominal_m3: 0.0025
        # Matches the sim spawn (SDF default_volume 2.2e-3 of the 2.5e-3
        # bladder) and the real pre-dive float state.
        initial_proportion_full: 0.88
        min_rpm: 500
        min_operating_rpm: 1000
        max_rpm: 3000
        pump_efficiency: 0.93
    acu_pitch:
      output_limits: [-0.11, -0.01]
    acu_roll:
      frequency_hz: 10
      kp: 0.5
      ki: 0.005
      kd: 0.05
      command_tolerance: 0.5
      integral_limits: [-30.0, 30.0]
      output_limits: [-30.0, 30.0]
      derivative_filter: 0.2

rig:
  sim:
    model_name: glider_nautilus
    world_name: oceans_waves
  plant:
    volume_per_rev_m3: 0.32e-6
    # Lake-calibrated operating range: fresh-water neutral sits at
    # 2.097e-3 m^3 (investigation/heave_calibration_fit.json), floor
    # matches the deepest real excursion (dive 2, ~1.03e-3), ceiling
    # leaves a 2% end-stop guard under the 2.5 L mechanical max.
    bladder_min_m3: 0.001
    bladder_max_m3: 0.00245
    bladder_nominal_m3: 0.0025
    # Tank sensor endpoints from the lake-test 'init' calibration
    # (tank_empty_pa / tank_full_pa as reported on the wire).
    tank_pressure_empty_pa: 97800.0
    tank_pressure_full_pa: 190000.0
    bcu_motor_min_rpm: 0
    bcu_motor_max_rpm: 3000
  faults:
    bcu_rpm:
      # Fault injection disabled — mttf_sec <= 0 means the degradation
      # ladder never steps. num_levels is kept at the baseline value so a
      # sweep flipping just mttf_sec back on is a one-line edit.
      mttf_sec: 0.0
      num_levels: 5
  bridges:
    bcu:
      publish_rate_hz: 10
    external_sensor:
      publish_rate_hz: 10
  # Sensor noise injected by the HAL sim bridges (Gaussian sigma +
  # digitizer quantization). Values are the fits from the 2026-06-24
  # lake test — provenance: UG-anomaly_detection/lake_test_jun24/
  # investigation/noise_characterization.json. `enabled: false`
  # restores noise-free bridges without touching the per-channel values.
  noise:
    enabled: true
    imu:
      accel_sigma_mps2: [0.01215, 0.02372, 0.009544]
      gyro_sigma_rads: [0.006541, 0.001033, 0.0008779]
    external_pressure:
      # Real channel is quantization-dominated: sub-LSB Gaussian, 100 Pa comb.
      sigma_pa: 0.0
      quantization_pa: 100.0
    tank_pressure:
      sigma_pa: 353.0
      quantization_pa: 600.0
