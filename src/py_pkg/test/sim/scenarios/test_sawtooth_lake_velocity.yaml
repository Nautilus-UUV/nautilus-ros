# Scenario for test_sawtooth_lake_velocity_sim — the lake-calibration
# acceptance gate.
#
# The bladder operating clamps are pinned to dive 4's steady-leg bladder
# volumes (UG-anomaly_detection/lake_test_jun24/investigation/
# heave_calibration_targets.csv, config B):
#   descent leg: V_b = 0.866e-3 m^3  (v_term 0.1245 m/s down)
#   ascent leg:  V_b = 2.465e-3 m^3  (v_term 0.0677 m/s up)
# During the saturated sawtooth legs the BCU rails at these clamps, so
# the sim reproduces dive 4's actual buoyancy offsets instead of railing
# to the library operating range. Everything else (plant, gains, lake
# noise ON) inherits the nominal defaults.
#
# The entry-momentum transient is pinned OFF: this test's measurand is
# the bladder-railed STEADY window, and the transient would only put the
# vehicle deeper before the rail engages, shrinking the railed depth run
# toward the detector's minimum. It has its own gate
# (test_rate_envelope_sim.py). Authoring the partial hydrodynamics block
# renders the Jinja template with every other value at the canonical
# default (ascent drag relief stays at the fitted 0.66).

seed: 4

rig:
  plant:
    bladder_min_m3: 0.000866
    bladder_max_m3: 0.002465
    # 0.0 = pin the gas-law cushion through both calibrated endpoints.
    # The widened bladder span above pushes the nominal free cushion's
    # bladder-min reading ~16 kPa past tank_pressure_full_pa; pinning
    # keeps this scenario off the map's interval clamp.
    tank_air_volume_m3: 0.0
  hydrodynamics:
    entry:
      peak_speed_mps: 0.0
