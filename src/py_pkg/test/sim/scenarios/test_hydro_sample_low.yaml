# Sampled perturbation: slipperier hull.
#
# Linear drag diagonals on the body scaled to 70% of nominal. Surge/heave/
# pitch-rate damping the controller has to fight is weaker than the
# canonical SDF -- the BCU loop should still close, just with a different
# transient shape. Exists to exercise the Jinja render path with
# non-default values.

seed: 0

rig:
  faults:
    bcu_rpm:
      mttf_sec: 0.0
  hydrodynamics:
    drag_xU: -75.6
    drag_yV: -5.6
    drag_zW: -36.54
    drag_kP: -9.1
    drag_mQ: -22.4
    drag_nR: -14.0
    drag_zWabsW: -305.69
