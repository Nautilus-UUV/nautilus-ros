# Error injection over a static (winner) physics + controller. Holds the
# winner PID gains, bladder bands, and rig config from
# suggested_lhs_0071.yaml fixed; the only swept dimension is the BCU
# RPM fault MTTF. The goal is to characterize how the suggested-winner
# controller degrades under the monotonic pump-RPM degradation ladder,
# with everything else held constant against the winner config.

description: >
  LHS sweep over the BCU RPM fault MTTF (mean time between 20% degradation
  steps) while pinning all plant + controller dimensions to the suggested
  pid_calibration winner (suggested_lhs_0071.yaml). MTTF target band is
  ~150-220 s. Use this to see how the winner controller behaves as the
  pump monotonically degrades 100 -> 80 -> ... -> 0%.

n_samples: 2000
seed: 0
base_scenario: suggested_lhs_0071.yaml

dimensions:
  # BCU fault injection: mean time between successive degradation steps.
  # The ladder is monotonic and latching (no recovery), so a lower MTTF
  # means the pump reaches lower effectiveness sooner within a run.
  #   mttf_sec in [150 s, 220 s]
  - { path: rig.faults.bcu_rpm.mttf_sec, distribution: loguniform, low: 150.0, high: 220.0 }
