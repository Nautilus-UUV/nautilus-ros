# PID calibration sweep: perturb the BCU-driving depth-loop PID gains
# (control.controllers.depth.pid_pressure.{kp,ki,kd}) together with the
# bladder operating-range clamps (rig.plant.bladder_{min,max}_m3).
#
# Bladder bands are bounded so the realized (min+max)/2 always sits
# near a fixed center of 0.001199 m^3 (~1.199 L), with a guaranteed
# inner clearance of 0.00036 m^3 on each side. Each band is sampled
# independently with LHS, so the realized center jitters around 0.001199
# but never collapses closer than +/-0.00036.
#
#   bladder_min_m3 in [0.00025, 0.000839]   = [current_min, center - 0.00036]
#   bladder_max_m3 in [0.001559, 0.00225]   = [center + 0.00036, current_max]
#
# PID gains stay at +/- 50% of nominal as in earlier sweeps.

description: >
  LHS sweep over the depth outer-loop PID gains (kp/ki/kd of
  pid_pressure) at +/- 50% of nominal, plus bladder min/max around
  a 0.001199 m^3 center with >= 0.00036 m^3 of inner headroom on each
  side. BCU fault injection is on with MTTF ~3 min and duration ~30 s
  (tight bands around those targets). Base scenario is baseline.yaml.

n_samples: 1880
seed: 0
base_scenario: nominal.yaml

dimensions:
  # Depth outer-loop PID gains: +/- 50% around nominal.
  - { path: control.controllers.depth.pid_pressure.kp, distribution: uniform, low: 2.0e-7, high: 6.0e-7 }
  - { path: control.controllers.depth.pid_pressure.ki, distribution: uniform, low: 5.0e-9, high: 1.5e-8 }
  - { path: control.controllers.depth.pid_pressure.kd, distribution: uniform, low: 7.5e-6, high: 2.25e-5 }

  # Bladder operating-range clamps. Bands are asymmetric on purpose:
  - { path: rig.plant.bladder_min_m3, distribution: uniform, low: 0.00025,  high: 0.000839 }
  - { path: rig.plant.bladder_max_m3, distribution: uniform, low: 0.001559, high: 0.00225  }

  # Fault injection is per-run and persistent now (sampler >= 2.0.0):
  # author an `anomaly_mix:` block (see validation_mix_v1.yaml) instead
  # of sampling a fault dimension — e.g. rig.faults.bcu_pump.effectiveness
  # is drawn from the mix's band for the runs assigned the bcu_pump class.
