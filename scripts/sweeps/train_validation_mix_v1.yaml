# Tran and validation dataset v1: 1024 fixed 2-cycle sawtooth dives, 3-40 m,
# with the stratified per-run anomaly mix (sampler >= 2.0.0).
#
# test/unit/test_anomaly_envelope_separation.py proves the band/envelope
# separation on v1 and asserts this file's anomaly_mix + envelope
# dimensions are identical, so every proof transfers. Only the sweep
# size, seed, and mission dims differ:
#
#   - n_samples 1024 -> largest-remainder stratified counts
#     820 nominal + 51 per anomaly class (nominal takes the tie).
#   - Every run is a sawtooth of exactly 2 full cycles (surface ->
#     depth -> surface, twice): `mission.n_oscillations` is the integer
#     floor of uniform [2, 3), i.e. constant 2, riding the manifest so
#     the cycle count can never be lost to a forgotten launch arg.
#   - Dive depth sampled uniformly over 3-40 m of fresh water
#     (target_pressure_pa = depth_m x 9806 Pa/m gauge). The
#     dave_ocean_waves seafloor sits at ~95 m — clearance everywhere.
#
# Each run self-labels: the scenario YAML carries an `anomaly:` block
# (validated against rig.faults at load), manifest.json carries a
# per-run `anomaly` record nominal-included, and in-sim the
# anomaly_label_bridge broadcasts /anomaly/label into the bag with
# per-class `active` semantics.
#
#   run_sweep.py ... --launch sawtooth_sim.launch.py \
#       --per-run-timeout 6000 --launch-args angle_rad:=0.0 z:=-0.115
#
# Timeout: worst case is 2 x 40 m x 2 legs = 160 m of vertical travel;
# biofouled runs glide ~0.63x heave speed (drag x2.5) and a 0.30-
# effectiveness pump adds ~340 s per full bladder stroke at the leg
# turns, so 4800 s runs out of margin — 6000 s covers the corner.

description: >
  Train and validation mix v1: 1024 fixed 2-cycle sawtooth dives with depth
  sampled 3-40 m, on the v1 nominal envelope (physics knobs +
  correlated buoyancy + transient plant spread) with the stratified
  80/5/5/5/5 per-run anomaly mix — persistent whole-run bcu_pump /
  sensor / comms / biofouling faults at severities outside the
  normality envelope. Lake noise on, surfaced start.

n_samples: 1024
seed: 1031
base_scenario: "nominal_with_hydrodynamics.yaml"
sampling_mode: "physics"
isotropic_jitter_sigma: 0.05

buoyancy_derivation:
  spawn_policy: bladder_max        # pre-dive bladder-full float
  min_dive_margin_m3: 2.0e-4       # >= 0.067 m/s descent authority
  min_climb_margin_m3: 1.5e-4      # biofouling runs use the relaxed
                                   # margin from the mix block below

anomaly_mix:
  weights: {nominal: 0.80, bcu_pump: 0.05, sensor: 0.05, comms: 0.05, biofouling: 0.05}

  bcu_pump:
    # Steady-flow separation: envelope flow spans x0.90..x1.10 of
    # nominal via volume_per_rev; 0.75 x 1.10 = 0.825 < 0.90 (8.3% gap).
    # Floor 0.30 keeps a full bladder stroke ~ 336 s — viable in 6000 s.
    effectiveness: {low: 0.30, high: 0.75}
    # Degraded transient, fully disjoint from the envelope bands
    # (delay <= 1.586 s, slew >= 341.4 rpm/s); overrides the nominal
    # draw of the same rig.plant fields for these runs.
    response_delay_s: {low: 2.5, high: 5.0}
    slew_rpm_per_s: {low: 100.0, high: 250.0}

  sensor:
    channels: [external_pressure, tank_pressure]
    archetypes: [bias, drift, stuck, dropout]
    bands:
      external_pressure:
        # Nominal channel: zero bias/drift, quantization 100 Pa
        # (half-step 50 Pa) -> floors are >= 20x any nominal artifact.
        bias:    {low: 1000.0, high: 10000.0, signed: true}   # Pa
        drift:   {low: 1.0,    high: 10.0,    signed: true}   # Pa/s
        dropout: {low: 0.2,    high: 0.8}                     # drop prob
      tank_pressure:
        # Nominal 3-sigma noise ~ 1.18 kPa (sigma 353 + 600 Pa comb);
        # bias floor 5 kPa >= 4x that.
        bias:    {low: 5000.0, high: 20000.0, signed: true}   # Pa
        drift:   {low: 5.0,    high: 50.0,    signed: true}   # Pa/s
        dropout: {low: 0.2,    high: 0.8}

  comms:
    # Nominal link never drops (rates fixed, drop prob exactly 0).
    # 0.8 leaves ~2 Hz effective depth feedback — degraded, still flyable.
    drop_prob: {low: 0.30, high: 0.80}

  biofouling:
    # Envelope worst multiplicative extremes incl. 3-sigma jitter
    # (e^0.15 = 1.162): heave drag ~ x1.36, added mass ~ x1.21.
    drag_mult:       {low: 1.6,  high: 2.5}
    added_mass_mult: {low: 1.3,  high: 1.5}
    # Neutral-volume band is 8.0e-5 m^3 wide (== 0.080 kg): 0.09 kg
    # pushes every fouled run past the envelope ceiling; 0.18 kg caps
    # the worst-corner climb margin at 3.5e-5 >= the relaxed minimum.
    fouling_mass_kg: {low: 0.09, high: 0.18}
    # A barely-climbing vehicle IS the biofouling signature.
    min_climb_margin_m3: 3.0e-5

dimensions:
  # --- hull / fin geometry causes (identical bands to v2/jun24) ---
  - { path: L,                  distribution: loguniform, low: 1.470,   high: 1.530 }
  - { path: D,                  distribution: loguniform, low: 0.1455,  high: 0.1545 }
  - { path: nabla,              distribution: loguniform, low: 0.01782, high: 0.01818 }
  - { path: b_f,                distribution: loguniform, low: 0.3135,  high: 0.3465 }
  - { path: c_f,                distribution: loguniform, low: 0.2090,  high: 0.2310 }
  - { path: x_f,                distribution: loguniform, low: 0.6650,  high: 0.7350 }
  - { path: b_r,                distribution: loguniform, low: 0.2090,  high: 0.2310 }
  - { path: c_r,                distribution: loguniform, low: 0.1045,  high: 0.1155 }
  - { path: x_r,                distribution: loguniform, low: 0.89205, high: 0.98595 }
  - { path: t_over_c,           distribution: loguniform, low: 0.0840,  high: 0.1560 }
  - { path: alpha_stall_horiz,  distribution: loguniform, low: 0.1360,  high: 0.2040 }
  - { path: alpha_stall_rudder, distribution: loguniform, low: 0.1360,  high: 0.2040 }
  - { path: C_d_c,              distribution: loguniform, low: 0.9350,  high: 1.2650 }
  - { path: one_plus_k,         distribution: loguniform, low: 1.0200,  high: 1.3800 }
  - { path: C_p_base,           distribution: loguniform, low: 0.0560,  high: 0.1040 }
  - { path: C_La_mult,          distribution: loguniform, low: 0.8250,  high: 1.3750 }

  # --- correlated buoyancy pair (trim masses + spawn volume derived) ---
  - { path: rig.hydrodynamics.fluid_density, distribution: uniform, low: 996.0, high: 1002.0 }
  - { path: derive.neutral_volume_m3, distribution: uniform, low: 2.055e-3, high: 2.135e-3 }

  # --- BCU plant truth (controller beliefs stay at nominal on purpose) ---
  - { path: rig.plant.tank_pressure_empty_pa, distribution: uniform, low: 97000.0,  high: 99000.0 }
  - { path: rig.plant.tank_pressure_full_pa,  distribution: uniform, low: 165000.0, high: 195000.0 }
  - { path: rig.plant.volume_per_rev_m3, distribution: loguniform, low: 2.88e-7, high: 3.52e-7 }
  - { path: rig.plant.bladder_min_m3, distribution: uniform, low: 0.0008,  high: 0.0012 }
  - { path: rig.plant.bladder_max_m3, distribution: uniform, low: 0.00235, high: 0.0025 }

  # --- pump/tank transients: x/1.5 around the 2026-06-24 fit ---
  - { path: rig.plant.pump_response_delay_s, distribution: loguniform, low: 0.705, high: 1.586 }
  - { path: rig.plant.pump_slew_rpm_per_s,   distribution: loguniform, low: 341.4, high: 768.2 }
  - { path: rig.plant.tank_air_volume_m3,    distribution: loguniform, low: 2.027e-3, high: 4.562e-3 }

  # --- per-run mission (launch args via manifest.json, not scenario fields) ---
  # Depth 3-40 m fresh-water gauge; integer floor of [2, 3) pins every
  # run to exactly 2 sawtooth cycles.
  - { path: mission.target_pressure_pa, distribution: uniform, low: 29418.0, high: 392240.0 }
  - { path: mission.n_oscillations, distribution: uniform, low: 2.0, high: 3.0, integer: true }
