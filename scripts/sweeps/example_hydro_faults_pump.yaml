# Worked-example sweep spec: hydrodynamics + BCU fault knobs + pump
# efficiency. Use this as the template for new sweeps — copy it, tweak
# the dimensions, point lhs_sample.py at it.
#
# Base scenario is nominal_with_hydrodynamics.yaml so the rig.hydrodynamics
# block is present at canonical values (the schema is all-or-nothing —
# omitting the block skips the Jinja render entirely, which would
# discard our perturbations). The sampler overlays each dimension's
# sampled value onto its dotted path; unlisted fields stay at the base.

description: >
  Hydrodynamic plant uncertainty (added mass + linear drag at +/- 20%),
  BCU fault rate/duration sweep, and controller pump-efficiency belief
  perturbation. Headline use case: study how depth-tracking degrades
  when the plant drifts off-nominal and the pump occasionally degrades.

n_samples: 64
seed: 42
base_scenario: nominal_with_hydrodynamics.yaml

dimensions:
  # Added-mass diagonal entries (kg), +/- 20% around canonical SDF values.
  - { path: rig.hydrodynamics.added_mass_xx, distribution: uniform, low: 4.240,  high: 6.360 }
  - { path: rig.hydrodynamics.added_mass_yy, distribution: uniform, low: 78.824, high: 118.236 }
  - { path: rig.hydrodynamics.added_mass_zz, distribution: uniform, low: 88.434, high: 132.652 }
  - { path: rig.hydrodynamics.added_mass_pp, distribution: uniform, low: 1.176,  high: 1.763 }
  - { path: rig.hydrodynamics.added_mass_qq, distribution: uniform, low: 16.214, high: 24.321 }
  - { path: rig.hydrodynamics.added_mass_rr, distribution: uniform, low: 12.891, high: 19.337 }

  # Linear-drag diagonal (N s/m), +/- 20%. Values are negative; `high`
  # must remain numerically greater than `low`, hence the ordering.
  - { path: rig.hydrodynamics.drag_xU, distribution: uniform, low: -129.6, high: -86.4 }
  - { path: rig.hydrodynamics.drag_yV, distribution: uniform, low: -9.6,   high: -6.4 }
  - { path: rig.hydrodynamics.drag_zW, distribution: uniform, low: -194.4, high: -129.6 }
  - { path: rig.hydrodynamics.drag_kP, distribution: uniform, low: -15.6,  high: -10.4 }
  - { path: rig.hydrodynamics.drag_mQ, distribution: uniform, low: -38.4,  high: -25.6 }
  - { path: rig.hydrodynamics.drag_nR, distribution: uniform, low: -24.0,  high: -16.0 }

  # BCU fault knobs. probability_per_sec is log-uniform so the sweep
  # spends equal samples per decade of MTTF (here ~20-200 s).
  - { path: rig.faults.bcu_rpm.probability_per_sec, distribution: loguniform, low: 0.005, high: 0.05 }
  - { path: rig.faults.bcu_rpm.duration_sec,        distribution: uniform,    low: 3.0,   high: 12.0 }

  # Controller's belief about pump efficiency (the plant's true value
  # stays at the SDF default). Captures depth-loop sensitivity to a
  # mis-modelled actuator.
  - { path: control.controllers.depth.plant_model.pump_efficiency, distribution: uniform, low: 0.85, high: 1.0 }
